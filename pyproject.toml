[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-data-playbook"
version = "0.1.0"
description = "Chinese task-oriented recipes for data analysis, machine learning and deep learning"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2", "matplotlib>=3.8,<4", "joblib>=1.3,<2"
]

[project.optional-dependencies]
dl = ["torch>=2.2,<3"]
io = ["pyarrow>=15", "openpyxl>=3.1"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]
kaggle = ["kaggle>=1.6"]

[project.scripts]
ml-playbook = "playbook.cli:main"

[tool.setuptools.packages.find]
include = ["playbook*"]
